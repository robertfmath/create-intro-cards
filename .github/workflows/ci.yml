# Workflow for formatting and linting, testing, and building documentation
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  format-and-lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Run Ruff formatting check
        run: uv run ruff format --check create_intro_cards.py tests/test_create_intro_cards.py

      - name: Run docformatter check
        run: uv run docformatter --check create_intro_cards.py tests/test_create_intro_cards.py

      - name: Run Ruff linting check
        run: uv run ruff check create_intro_cards.py tests/test_create_intro_cards.py

  test:
    needs: format-and-lint
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run python -m unittest tests/test_create_intro_cards.py

  build-docs:
    needs: test
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Build documentation
        run: |
          cd docs
          uv run make clean
          uv run make html

      - name: Deploy documentation to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
          force_orphan: true
